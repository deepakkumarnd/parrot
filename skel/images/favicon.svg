<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4bb45f"/>
      <stop offset="100%" stop-color="#2f9e4d"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#badge)"/>

  <!-- crest -->
  <g fill="#ffd23f" stroke="#e0a91f" stroke-width="1.6" stroke-linejoin="round">
    <path d="M26 13 C24 8 26 5 30 4 C31 9 30 13 28 16 Z"/>
    <path d="M32 11 C32 5 35 3 39 4 C39 9 37 13 35 16 Z"/>
    <path d="M38 13 C40 8 44 6 47 7 C45 12 42 15 40 17 Z"/>
  </g>

  <!-- head -->
  <circle cx="32" cy="36" r="22.5" fill="#57c06a" stroke="#1f7a3c" stroke-width="2.6"/>

  <!-- face -->
  <path d="M32 19 C43 19 49 27 49 36 C49 46 42 52 32 52 C23 52 16 46 15 37 C14 27 21 19 32 19 Z" fill="#ffd94a"/>

  <!-- cheeks -->
  <circle cx="19" cy="40" r="4.2" fill="#ff9fb2" opacity="0.7"/>
  <circle cx="45" cy="40" r="4.2" fill="#ff9fb2" opacity="0.7"/>

  <!-- eyes (no outline, wide-set so they stay cute, not spectacled, when tiny) -->
  <circle cx="23" cy="33" r="7" fill="#ffffff"/>
  <circle cx="41" cy="33" r="7" fill="#ffffff"/>
  <circle cx="24.4" cy="34" r="4" fill="#2b2b2b"/>
  <circle cx="39.6" cy="34" r="4" fill="#2b2b2b"/>
  <circle cx="22.6" cy="32.2" r="1.5" fill="#ffffff"/>
  <circle cx="37.8" cy="32.2" r="1.5" fill="#ffffff"/>

  <!-- beak -->
  <path d="M30 41 C28.5 41 27.5 43.5 28.5 46 C29.5 49.5 34 50.5 36.5 47.5 C38.5 45.5 38.5 42 36.5 40.5 C35 39.5 32 41 30 41 Z"
        fill="#ff8f3f" stroke="#d9691f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M29.5 44.5 C30.5 47 32.5 48.5 34.5 47.5 C33 50 30.5 49 29 46.5 Z" fill="#e0641c"/>
</svg>
